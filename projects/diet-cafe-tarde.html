<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚫️</text></svg>">
    <title>Café da tarde</title>
    <style>
        .no-scrollbar { scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-white m-0 p-0" style="font-family: 'Poppins', sans-serif;">
    <div class="mx-auto w-full max-w-[393px] h-dvh flex flex-col overflow-hidden">
        <div class="flex-1 flex flex-col gap-[56px] px-[24px] overflow-y-auto pt-[24px] pb-[48px] no-scrollbar">
            <!-- Header -->
            <div class="flex flex-col gap-[10px]">
                <a href="diet.html" class="w-[40px] h-[40px] flex items-center justify-center no-underline rounded-full border border-[#DDDDDD]">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-[20px] h-[20px]">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 15.75 3 12m0 0 3.75-3.75M3 12h18" />
                    </svg>
                </a>
                <p class="text-[32px] font-semibold text-black leading-normal">Detalhes da refeição</p>
            </div>

            <!-- Meal card -->
            <div class="bg-[#96f4fe] rounded-[24px] p-[24px] flex items-start justify-center w-full">
                <div class="flex flex-1 items-center justify-between text-[#166e77]">
                    <p class="text-[32px] font-bold">16:30</p>
                    <p class="text-[16px] font-semibold">Café da tarde</p>
                </div>
            </div>

            <!-- Description -->
            <p class="text-[18px] font-semibold text-black leading-normal">Whey protein (30g proteína)</p>

            <p class="text-[18px] font-semibold text-black leading-normal">Chia (10g)</p>

            <div class="flex flex-col gap-[8px] text-[18px]">
                <p class="font-semibold text-black leading-normal">Maçã (pequena)</p>
                <ul class="list-disc ml-[27px] text-[#808080] leading-normal"><li>Ou qualquer fruta (100g)</li></ul>
            </div>

            <div class="flex flex-col gap-[8px] text-[18px]">
                <p class="font-semibold text-black leading-normal">Aveia em flocos (30g)</p>
                <ul class="list-disc ml-[27px] text-[#808080] leading-normal"><li>Ou granola zero (30g)</li></ul>
            </div>
        </div>
    </div>
</body>
</html>
